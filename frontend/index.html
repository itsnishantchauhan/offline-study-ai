<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline StudyAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Offline StudyAI</h1>
        <p>🟢 Offline Mode</p>
    </header>

    <main>

        <section id="chat" class="input-area">
            <p>AI: Hello! How can I help you study?</p>
        </section>

        <section>
            <input type="text" id="question" placeholder="Ask your study question...!">

            <button id="askButton">Ask</button>
        </section>

    </main>


    <script src="script.js"></script>
</body>
</html>
